[advisories]
# RUSTSEC-2026-0459 (CVE-2026-119375): libsqlite3-sys via SQLite WAL page size mismatch.
# SQLite DB files are local to telegateway container (trusted host volume), not untrusted inputs.
# sqlx-sqlite 0.9.0 constrains libsqlite3-sys to ">=0.30.1, <0.38.0" (currently locked at 0.37.0).
# libsqlite3-sys >= 0.39 will be unlocked in a future sqlx release.
ignore = ["RUSTSEC-2026-0459"]
