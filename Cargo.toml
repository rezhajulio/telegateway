[package]
name = "telegateway"
version = "0.1.0"
edition = "2024"
description = "A reverse-proxy gateway for Telegram bots: webhook ingress, per-chat rate limiting, and structured observability."
license = "AGPL-3.0-or-later"
repository = "https://github.com/rezhajulio/telegateway"
authors = ["Rezha Julio <contact@rezhajulio.id>"]

[[bin]]
name = "telegateway"
path = "src/main.rs"

[lib]
name = "telegateway"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.7", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
constant_time_eq = "0.3"
governor = { version = "0.10", features = ["dashmap"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util", "limit", "timeout"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
rcgen = "0.13"
tower = { version = "0.5", features = ["util"] }

[profile.release]
strip = true
lto = true
