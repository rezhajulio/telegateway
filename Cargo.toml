[package]
name = "telegateway"
version = "0.1.0"
edition = "2024"
description = "A reverse-proxy gateway for Telegram bots: webhook ingress, per-chat rate limiting, and structured observability."
rust-version = "1.85"
license = "AGPL-3.0-or-later"
repository = "https://github.com/rezhajulio/telegateway"
authors = ["Rezha Julio <contact@rezhajulio.id>"]
readme = "README.md"
keywords = ["telegram", "webhook", "gateway", "bot", "reverse-proxy"]
categories = ["network-programming"]

[[bin]]
name = "telegateway"
path = "src/main.rs"

[lib]
name = "telegateway"
path = "src/lib.rs"

[dependencies]
anyhow = "1"
axum = "0.8"
axum-server = { version = "0.8", features = ["tls-rustls-no-provider"] }
clap = { version = "4", features = ["derive"] }
constant_time_eq = "0.3"
fastrand = "2"
governor = { version = "0.10", features = ["dashmap"] }
opentelemetry = { version = "0.28", features = ["metrics", "trace"] }
opentelemetry-otlp = { version = "0.28", features = ["http-proto", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.28", features = ["rt-tokio", "metrics", "trace"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls-webpki-roots"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["sqlite", "runtime-tokio", "migrate", "macros"] }
sqlx-sqlite = { version = "0.8", features = ["bundled"] }
thiserror = "2"
tokio = { version = "1", features = ["full"] }
toml = "0.8"
tower = { version = "0.5", features = ["util", "limit", "timeout", "load-shed"] }
tower-http = { version = "0.6", features = ["trace", "limit", "timeout"] }
tracing = "0.1"
tracing-opentelemetry = "0.29"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
proptest = "1"
rcgen = "0.13"
tempfile = "3"
tokio = { version = "1", features = ["full", "test-util"] }
[profile.release]
strip = true
lto = true
