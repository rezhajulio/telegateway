# Copy to config.toml and fill in your bots. Never commit the real file.
listen = "127.0.0.1:8080"

# Durable outbox: always on. Accepted updates are stored in SQLite and
# delivered asynchronously with retries. These are the defaults;
# uncomment to change them.
# [outbox]
# path = "outbox.db"
# max_attempts = 25
# poll_interval_ms = 1000
# delivered_retention_days = 7
# max_pending = 10000        # webhook sheds with 503 when pending+in_flight reaches this
# max_dead_letters = 10000   # dead letters kept per bot (oldest pruned first)
# delivery_concurrency = 1   # max concurrent deliveries per bot across chats (downstream will see up to N concurrent requests)
# Circuit breaker per downstream bot: after this many consecutive
# failures, delivery pauses for cooldown_secs, then a probe goes out.
# [circuit_breaker]
# failure_threshold = 5
# cooldown_secs = 60
# max_cooldown_secs = 600

# Admin API: guards the /outbox listing and /outbox/replay routes.
# The routes are not registered without this section. Token must be at least 32 chars.
# [admin]
# token = "change-me-to-a-long-random-value-at-least-32-chars"
# Optional: serve admin routes on a separate socket address. When set, admin
# routes are absent from the public listener. Must differ from `listen`.
# listen = "127.0.0.1:9090"
# OpenTelemetry: export traces and metrics via OTLP/HTTP to a collector.
# Without this section, nothing leaves the process. A dead collector only
# drops telemetry; it never breaks the gateway.
# [otel]
# endpoint = "http://localhost:4318"
# service_name = "telegateway"

# Optional: register webhooks with Telegram on startup instead of calling
# setWebhook by hand. Requires `public_url` and a `bot_token` per bot.
# public_url = "https://gateway.example.com"
# auto_register = true

# Optional: terminate TLS in the gateway itself when no reverse proxy
# sits in front. With [tls] present, `listen` serves HTTPS.
# [tls]
# cert_path = "/etc/telegateway/fullchain.pem"
# key_path = "/etc/telegateway/privkey.pem"

[[bots]]
# Public route: POST /webhooks/mediadownloadbot
id = "mediadownloadbot"
# Token from BotFather. Only needed for webhook registration.
# bot_token = "123456:ABC-DEF1234ghIkl-zyx57W2v1u123ew11"
# Internal bot endpoint that receives the forwarded update.
downstream_url = "http://127.0.0.1:8081/webhook"
# Must match the secret passed to Telegram's setWebhook (1-256 chars, [A-Za-z0-9_-]).
webhook_secret = "change_me_to_a_long_random_value"
# Token-bucket quota per chat, refilled every minute.
rate_limit_per_minute = 30

